name = "trivia-rumble-elite"
main = "dist/worker.js"
compatibility_date = "2026-09-01"
compatibility_flags = ["nodejs_compat"]

# Sensitive Firebase Admin SDK secrets (FIREBASE_SERVICE_ACCOUNT_JSON, FIREBASE_RTDB_URL,
# FIREBASE_PROJECT_ID) and DISCORD_CLIENT_SECRET must be stored as encrypted Cloudflare
# Worker Secrets (`wrangler secret put` or Cloudflare Dashboard -> Variables and Secrets),
# never committed to wrangler.toml.
[vars]
SUPPORT_URL = "https://donate-to-sgss.pages.dev"

[assets]
directory = "./public"
binding = "STATIC_ASSETS"
run_worker_first = true
